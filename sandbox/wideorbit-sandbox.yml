  status: 200
  note: Renders "WideOrbit - Sign in".
- url: https://ppe-sso.wocentral.com/auth/realms/externalgateway/.well-known/openid-configuration
  status: 200
  note: Parallel pre-production Keycloak realm — the evidence that PPE is a real environment.
- url: https://apigateway.wideorbit.com/
  status: 302
