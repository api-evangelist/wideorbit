- url: https://apigateway.wideorbit.com/
  status: 302
  note: >-
    Gateway 302s every unauthenticated request to the WO Central Keycloak sign-in,
    so no live rate-limit headers can be observed anonymously. Kong response
    headers (x-kong-response-latency, x-kong-request-id) are present but carry no
    rate-limit fields.
notes: >-
