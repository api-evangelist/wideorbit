description: >-
  Well-known endpoint discovery for WideOrbit, re-probed 2026-08-12. The
  WideOrbit.io API gateway (apigateway.wideorbit.com) delegates authentication to
  the WO Central identity provider, a Keycloak deployment whose "externalgateway"
  realm publishes a public OpenID Connect discovery document — the one real
  well-known document WideOrbit serves. Everything else misses. Note the two
  distinct failure shapes: on the marketing host every /.well-known/ path 301s to
  the canonical URL and then 404s, while on the Kong gateway host EVERY path,
  including ones that do not exist, answers 302 to the Keycloak sign-in. The
  gateway's blanket 302 is a catch-all, not evidence of a document, and is
  recorded as a miss.
