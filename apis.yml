    Certified-partner API gateway for WideOrbit.io providing real-time,
    object-level interaction with WideOrbit Traffic, Network, and Omni systems.
    Access is restricted to authorized, WideOrbit-certified software providers
    and secured with OpenID Connect (Keycloak) via WO Central single sign-on;
    the API catalog and specifications are published inside the authenticated
    developer portal rather than openly.
