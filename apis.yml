apis:
- name: WideOrbit.io API Gateway
  description: >-
    Certified-partner API gateway for WideOrbit.io providing real-time,
    object-level interaction with WideOrbit Traffic, Network, and Omni systems.
    Access is restricted to authorized, WideOrbit-certified software providers
    and secured with OpenID Connect (Keycloak) via WO Central single sign-on;
    the API catalog and specifications are published inside the authenticated
    developer portal rather than openly.
  humanURL: https://www.wideorbit.com/io/
  baseURL: https://apigateway.wideorbit.com
  tags:
  - Advertising
  - Media
  - Ad Management
  properties:
  - type: Authentication
    url: authentication/wideorbit-authentication.yml
  - type: OAuthScopes
    url: scopes/wideorbit-scopes.yml
  - type: Sandbox
    url: sandbox/wideorbit-sandbox.yml
- name: WO Data API
  description: >-
    REST bulk-export service that provides access to WO Network, WO Traffic and
    WO Omni data "in a unified version agnostic manner". Every export is
    asynchronous: a submit call returns a RequestId and the result is pushed
    later, in chunks, to a destination the caller nominates — an HTTP endpoint,
    FTP, local storage, e-mail, AWS S3, Google Cloud or the caller's own Kafka
    brokers — with a callback acknowledgement closing the loop. Authenticated by
    three flat request headers (partner-id, api-key, agreement-key) issued out of
    band by WideOrbit Support under what the guide calls a "closed authentication
    model". This is the only WideOrbit API with a publicly readable reference,
    and that reference is a 60-page PDF; the base URL is templated as {root} and
    is provisioned per partner rather than published.
  humanURL: https://www.wideorbit.com/wp-content/uploads/2022/07/WO-DATA-API-Guide-Version-421_New.pdf
